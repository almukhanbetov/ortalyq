# CI: тесты backend, проверка TypeScript и сборка frontend.
# Секреты не используются; для pull_request выдаётся только read-токен.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: ortalyq_ci
          POSTGRES_USER: ortalyq
          POSTGRES_PASSWORD: ci-only-not-a-secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ortalyq -d ortalyq_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://ortalyq:ci-only-not-a-secret@localhost:5432/ortalyq_ci?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "Неотформатированные файлы:"; echo "$out"; exit 1; fi
      - name: go vet
        run: go vet ./...
      - name: go test (юнит + интеграция с PostgreSQL)
        run: go test -count=1 -race ./...
      - name: Smoke-тест сервера (миграции, /api/health, /api/ready)
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
          APP_SECRET: ci-only-app-secret-0123456789abcdef
          BACKEND_ADDR: 127.0.0.1:18080
        run: |
          CGO_ENABLED=0 go build -trimpath -o /tmp/server ./cmd/server
          /tmp/server migrate
          /tmp/server serve > /tmp/server.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/api/ready && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/api/health
          curl -fsS http://127.0.0.1:18080/api/ready
          curl -fsS http://127.0.0.1:18080/api/subjects > /dev/null
          kill %1 || true
          cat /tmp/server.log

  frontend:
    name: Frontend (TypeScript + build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Проверка TypeScript
        run: npm run lint
      - name: Сборка
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_INTERNAL_URL: http://backend:18080
        run: npm run build

  build-context:
    name: Сборочный контекст без секретов
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - run: scripts/check-build-context.sh
      - name: В Git нет .env и ключей
        run: |
          if git ls-files | grep -Ei '(^|/)\.env(\.|$)|\.(pem|key|p12|pfx)$|kubeconfig' | grep -v '\.env\.example$'; then
            echo "В репозитории есть файлы, похожие на секреты"; exit 1
          fi
