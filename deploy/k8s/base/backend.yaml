# API (Go). Одна реплика: realtime-хаб доски и чата живёт в памяти процесса.
# Образ меняет только CI (kubectl set image ...:<sha>@<digest>); тег "bootstrap" заменяет apply.sh.
# Миграции выполняет отдельный Job перед выкатом (scripts/ortalyq-deploy); serve при старте
# повторно проверяет миграции — для уже применённой схемы это no-op.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ortalyq
  labels: {app.kubernetes.io/name: backend}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: backend}
  ports:
    - name: http
      port: 18080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ortalyq
  labels: {app.kubernetes.io/name: backend}
spec:
  replicas: 1
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backend}
    spec:
      imagePullSecrets: [{name: ghcr-pull}]
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: backend
          image: ghcr.io/almukhanbetov/ortalyq-backend:bootstrap
          args: ["serve"]
          envFrom:
            - configMapRef: {name: ortalyq-config}
          env:
            - {name: BACKEND_ADDR, value: ":18080"}
            - {name: TZ, value: UTC}
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: DATABASE_URL}}
            - name: APP_SECRET
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: APP_SECRET}}
            - name: LIVEKIT_API_KEY
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: LIVEKIT_API_KEY}}
            - name: LIVEKIT_API_SECRET
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: LIVEKIT_API_SECRET}}
            - name: S3_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: S3_ACCESS_KEY}}
            - name: S3_SECRET_KEY
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: S3_SECRET_KEY}}
            # Исполнитель кода (Judge0 на ОТДЕЛЬНОМ сервере, docs/CODE_RUNNER.md). Secret необязателен:
            # пока его нет, редактор кода работает, а запуск показывает «Сервис выполнения не настроен».
            # Создаётся ../scripts/set-code-runner.sh.
            - name: CODE_RUNNER_URL
              valueFrom: {secretKeyRef: {name: ortalyq-code-runner, key: CODE_RUNNER_URL, optional: true}}
            - name: CODE_RUNNER_TOKEN
              valueFrom: {secretKeyRef: {name: ortalyq-code-runner, key: CODE_RUNNER_TOKEN, optional: true}}
            - name: CODE_RUNNER_PYTHON_ID
              valueFrom: {secretKeyRef: {name: ortalyq-code-runner, key: CODE_RUNNER_PYTHON_ID, optional: true}}
            # ИИ «Учебной мастерской» (docs/WORKSHOP.md). Secret ortalyq-openai необязателен: без него
            # совместный текст и сохранённые материалы работают, а функции ИИ явно недоступны.
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: ortalyq-openai, key: OPENAI_API_KEY, optional: true}}
            - name: OPENAI_MODEL
              valueFrom: {secretKeyRef: {name: ortalyq-openai, key: OPENAI_MODEL, optional: true}}
            # Адрес, с которого Nginx хоста приходит в под (через ClusterIP). Только от него принимается
            # X-Forwarded-For — иначе ограничения частоты (вход, регистрация, пробный урок) можно обойти
            # подменой заголовка. ConfigMap создаёт ../scripts/set-trusted-proxy.sh (определяет адрес на узле).
            # Пока его нет — доверие только loopback: подмена невозможна, но все клиенты делят лимиты адреса Nginx.
            - name: TRUSTED_PROXIES
              valueFrom: {configMapKeyRef: {name: ortalyq-proxy, key: TRUSTED_PROXIES, optional: true}}
          ports:
            - {name: http, containerPort: 18080}
          startupProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /api/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}   # временные файлы multipart-загрузок
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
