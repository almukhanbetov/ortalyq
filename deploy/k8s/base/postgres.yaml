# PostgreSQL 17. Данные — на локальном PV /srv/ortalyq/postgres (Retain, привязка к узлу), см. ../storage.
# Доступен только внутри кластера (ClusterIP), наружу не публикуется.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: ortalyq
spec:
  storageClassName: ortalyq-local
  volumeName: ortalyq-postgres
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ortalyq
  labels: {app.kubernetes.io/name: postgres}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: postgres}
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ortalyq
  labels: {app.kubernetes.io/name: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres}
    spec:
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - {name: POSTGRES_DB, value: ortalyq}
            - {name: POSTGRES_USER, value: ortalyq}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: ortalyq-secrets, key: POSTGRES_PASSWORD}}
            # Подкаталог: корень тома может содержать lost+found
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
          ports:
            - {name: postgres, containerPort: 5432}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "ortalyq", "-d", "ortalyq"]}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "ortalyq", "-d", "ortalyq"]}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: postgres-data}
        # Разделяемая память PostgreSQL (не постоянные данные)
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
