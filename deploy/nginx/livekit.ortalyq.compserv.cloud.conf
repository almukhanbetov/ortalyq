# ORTALYQ: LiveKit https/wss://livekit.ortalyq.compserv.cloud → 127.0.0.1:7880 (под LiveKit в сети хоста).
# Через Nginx идут только сигнальный WebSocket (/rtc) и API (/twirp); медиа идёт напрямую на
# 194.31.55.106: UDP 7882 и TCP 7881 (их нужно открыть в firewall).

map $http_upgrade $ortalyq_lk_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;          # HTTP/2: nginx >= 1.25.1 — добавьте «http2 on;», старше — «listen 443 ssl http2;»
    # listen [::]:443 ssl;
    server_name livekit.ortalyq.compserv.cloud;

    ssl_certificate     /etc/letsencrypt/live/ortalyq.compserv.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortalyq.compserv.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $ortalyq_lk_connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }
}
