# ORTALYQ: порт 80 только для новых поддоменов — ACME (Let's Encrypt) и редирект на HTTPS.
# Установка: /etc/nginx/sites-available/ortalyq-http.conf → ссылка в sites-enabled.
# Существующие server-блоки compserv.cloud не затрагиваются (другие server_name).
server {
    listen 80;
    # listen [::]:80;   # раскомментируйте, если существующая конфигурация слушает IPv6
    server_name ortalyq.compserv.cloud livekit.ortalyq.compserv.cloud;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/ortalyq-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
