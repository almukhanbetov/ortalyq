# ORTALYQ: сайт https://ortalyq.compserv.cloud
#   /api/*  → Service backend (ClusterIP:18080), включая WebSocket занятий /api/lessons/:id/ws
#   /       → Service frontend (ClusterIP:3000)
# Адреса upstream генерирует deploy/nginx/render-upstreams.sh в /etc/nginx/ortalyq/upstreams.conf.
# Порты 3001/8080 старого приложения не используются. Ingress-контроллер не нужен.

include /etc/nginx/ortalyq/upstreams.conf;

map $http_upgrade $ortalyq_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;          # HTTP/2: nginx >= 1.25.1 — добавьте «http2 on;», старше — «listen 443 ssl http2;»
    # listen [::]:443 ssl;   # раскомментируйте, если существующая конфигурация слушает IPv6
    server_name ortalyq.compserv.cloud;

    ssl_certificate     /etc/letsencrypt/live/ortalyq.compserv.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ortalyq.compserv.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ortalyq_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # MAX_UPLOAD_MB=20 + запас на multipart
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /api/ {
        proxy_pass http://ortalyq_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $ortalyq_connection_upgrade;
        # WebSocket занятия (доска, чат) живёт весь урок
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Временные ссылки на файлы и записи (Range-запросы) отдаются потоком
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://ortalyq_frontend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $ortalyq_connection_upgrade;
        proxy_read_timeout 120s;
    }
}
